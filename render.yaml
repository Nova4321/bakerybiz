# Render Blueprint — BakeryBiz API Server
# https://docs.render.com/blueprint-spec
services:
  - type: web
    name: bakerybiz-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    repo: https://github.com/Nova4321/bakerybiz.git
    branch: main
    plan: free
    healthCheckPath: /api/healthz
    envVars:
      - key: PORT
        value: "5000"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false  # You'll set this manually from Neon
      - key: FRONTEND_URL
        sync: false  # You'll set this after Vercel deploy
